name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Write-up source lives in the private apotheca repo (site/).
      - uses: actions/checkout@v4
        with:
          repository: sheljustdoes/apotheca
          token: ${{ secrets.APOTHECA_TOKEN }}
          path: .apotheca
          sparse-checkout: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/locked.mjs pull --from .apotheca && rm -rf .apotheca
      # One password per locked project; scripts/protect.mjs fails the build if one is missing.
      - run: npm run build
        env:
          # Read-only on the project repositories: dates each write-up's "Last updated".
          REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
          LOCK_IRIDIS: ${{ secrets.LOCK_IRIDIS }}
          LOCK_FRAGARIA: ${{ secrets.LOCK_FRAGARIA }}
          LOCK_RECOLO: ${{ secrets.LOCK_RECOLO }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
